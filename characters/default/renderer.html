<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Live2D Desktop Pet - Hiyori</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}
#canvas-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
}
canvas {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

/* Dynamic Active Status Pill (Fades in ONLY during active gazing or typing) */
#status-badge {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%) scale(0.9);
  background: rgba(30, 18, 38, 0.94);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 140, 180, 0.55);
  border-radius: 12px;
  padding: 3px 10px;
  font-size: 10px;
  font-weight: bold;
  color: #ff94b8;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  box-shadow: 0 3px 12px rgba(255, 105, 180, 0.35);
  z-index: 85;
  pointer-events: none;
  opacity: 0;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#status-badge.badge-visible {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

/* Floating Speech Bubble (跟随主聊天界面深浅色主题，简约高雅，不花哨) */
#care-bubble {
  position: fixed;
  top: 8px;
  left: 8px;
  right: 8px;
  min-height: 40px;
  max-height: 84px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 12px;
  padding: 6px 9px;
  z-index: 92;
  pointer-events: auto;
  cursor: pointer;
  transform: translateY(0) scale(1);
  opacity: 1;
  overflow: hidden;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* 默认 / 暗黑主题 (与主界面暗黑卡片一致：深灰半透微磨砂，中性雅致边框，零荧光刺眼) */
body:not(.theme-light) #care-bubble {
  background: rgba(26, 26, 30, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
}
body:not(.theme-light) #care-bubble::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 28px;
  width: 9px;
  height: 9px;
  background: rgba(26, 26, 30, 0.95);
  border-right: 1px solid rgba(255, 255, 255, 0.12);
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  transform: rotate(45deg);
}
body:not(.theme-light) .care-author {
  color: #f4f4f5;
}
body:not(.theme-light) .care-time-tag {
  background: rgba(255, 255, 255, 0.08);
  color: #d4d4d8;
  border: 1px solid rgba(255, 255, 255, 0.12);
}
body:not(.theme-light) #care-bubble-text {
  color: #e4e4e7;
  text-shadow: none;
}

/* 白色高雅浅色主题 (与主界面白色卡片一致：纯白半透微磨砂，浅灰精致描边) */
body.theme-light #care-bubble {
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(0, 0, 0, 0.12);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1), 0 2px 6px rgba(0, 0, 0, 0.05);
}
body.theme-light #care-bubble::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 28px;
  width: 9px;
  height: 9px;
  background: rgba(255, 255, 255, 0.96);
  border-right: 1px solid rgba(0, 0, 0, 0.12);
  border-bottom: 1px solid rgba(0, 0, 0, 0.12);
  transform: rotate(45deg);
}
body.theme-light .care-author {
  color: #0f172a;
}
body.theme-light .care-time-tag {
  background: #f1f5f9;
  color: #475569;
  border: 1px solid #e2e8f0;
}
body.theme-light #care-bubble-text {
  color: #1e293b;
  text-shadow: none;
}

#care-bubble.care-bubble-hidden {
  opacity: 0;
  transform: translateY(-12px) scale(0.88);
  pointer-events: none;
}
.care-bubble-header {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 3px;
}
.care-avatar {
  font-size: 11px;
}
.care-author {
  font-size: 11px;
  font-weight: bold;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
}
.care-time-tag {
  margin-left: auto;
  font-size: 9px;
  padding: 1.5px 6px;
  border-radius: 6px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
#care-bubble-text {
  font-size: 10px;
  line-height: 1.4;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
  font-weight: 500;
  word-break: break-word;
}

/* Sleep FX */
#sleep-fx {
  position: fixed;
  top: 76px;
  right: 18px;
  font-size: 20px;
  color: #a8d5ff;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(168, 213, 255, 0.8);
  display: none;
  z-index: 70;
  animation: sleepFloat 2.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes sleepFloat {
  0% { transform: translateY(0) scale(0.7); opacity: 0.2; }
  50% { transform: translateY(-10px) scale(1.1); opacity: 0.9; }
  100% { transform: translateY(-20px) scale(1.3); opacity: 0; }
}

/* Headpat Interactive Hitbox */
#headpat-zone {
  position: fixed;
  top: 72px;
  left: 50%;
  transform: translateX(-50%);
  width: 90px;
  height: 55px;
  z-index: 75;
  cursor: pointer;
}

/* Floating Heart Effect on Headpat */
.heart-fx {
  position: fixed;
  pointer-events: none;
  font-size: 16px;
  z-index: 120;
  animation: floatHeart 0.9s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
}
@keyframes floatHeart {
  0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
  100% { opacity: 0; transform: translate(var(--dx, 0px), -45px) scale(1.3); }
}

/* Custom Timer Modal */
#timer-modal {
  position: fixed;
  bottom: 46px;
  left: 10px;
  right: 10px;
  background: rgba(34, 22, 42, 0.97);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255, 140, 180, 0.65);
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 4px 18px rgba(255, 105, 180, 0.35);
  z-index: 96;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transform: translateY(0) scale(1);
  opacity: 1;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#timer-modal.modal-hidden {
  opacity: 0;
  transform: translateY(15px) scale(0.85);
  pointer-events: none;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-title {
  font-size: 11px;
  font-weight: bold;
  color: #ff94b8;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.modal-close {
  color: #ffb3cc;
  font-size: 12px;
  cursor: pointer;
  padding: 0 4px;
}
.preset-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.time-chip {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 140, 180, 0.35);
  border-radius: 6px;
  color: #fff4f8;
  font-size: 10px;
  font-weight: bold;
  padding: 4px 0;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s ease;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.time-chip:hover {
  background: rgba(255, 105, 180, 0.35);
  border-color: #ff6599;
}
.custom-timer-row {
  display: flex;
  gap: 4px;
  align-items: center;
}
.custom-timer-input {
  flex: 1;
  background: rgba(20, 14, 26, 0.8);
  border: 1px solid rgba(255, 140, 180, 0.4);
  border-radius: 6px;
  color: #ffffff;
  padding: 3px 6px;
  font-size: 11px;
  text-align: center;
  font-weight: bold;
  outline: none;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.custom-timer-input:focus {
  border-color: #ff6599;
  box-shadow: 0 0 6px rgba(255, 105, 180, 0.4);
}
.start-timer-btn {
  background: linear-gradient(135deg, #ff6599, #ff8da1);
  border: none;
  border-radius: 6px;
  color: #ffffff;
  font-size: 10.5px;
  font-weight: bold;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.15s ease;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.start-timer-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 2px 8px rgba(255, 105, 180, 0.5);
}

/* Compact 3x2 Snack Tray (0 Overflow) */
#snack-tray {
  position: fixed;
  bottom: 46px;
  left: 10px;
  right: 10px;
  background: rgba(34, 22, 42, 0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255, 140, 180, 0.65);
  border-radius: 12px;
  padding: 6px 6px;
  box-shadow: 0 4px 18px rgba(255, 105, 180, 0.35);
  z-index: 95;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transform: translateY(0) scale(1);
  opacity: 1;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#snack-tray.tray-hidden {
  opacity: 0;
  transform: translateY(15px) scale(0.85);
  pointer-events: none;
}
.tray-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2px;
}
.tray-title {
  font-size: 10px;
  font-weight: bold;
  color: #ff94b8;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.tray-close {
  color: #ffb3cc;
  font-size: 11px;
  cursor: pointer;
  padding: 0 4px;
}
.tray-items {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}
.snack-btn {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 140, 180, 0.3);
  border-radius: 6px;
  padding: 4px 0;
  font-size: 15px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.snack-btn:hover {
  background: rgba(255, 105, 180, 0.35);
  transform: scale(1.12);
  border-color: #ff6b9d;
}


/* ============================================================ */
/* 🌸 春日和专属 动漫高精双手扒边探头挂件 (Anime Peeker Avatar)   */
/* ============================================================ */
.peeker-avatar {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 52px;
  height: auto;
  z-index: 99;
  display: none;
  pointer-events: auto;
  cursor: pointer;
  user-select: none;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  animation: peekerBreathe 2.6s ease-in-out infinite alternate;
  transition: filter 0.2s ease;
}
@keyframes peekerBreathe {
  0% { transform: translateY(-50%) scale(1); }
  100% { transform: translateY(-53%) scale(1.04); }
}
.peeker-avatar:hover {
  filter: drop-shadow(0 6px 18px rgba(255, 105, 180, 0.75)) brightness(1.06);
}

#peeker-img-right {
  left: 0;
}
#peeker-img-left {
  right: 0;
}

#desk-stage {
  transition: opacity 0.25s ease;
}
.desk-hidden {
  opacity: 0 !important;
  pointer-events: none !important;
}

/* Compact Desk Stage */
#desk-stage {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 48px;
  z-index: 50;
  pointer-events: none;
  background: linear-gradient(180deg, #dfab7b 0%, #ba8252 50%, #9c683b 100%);
  border-top: 3px solid #ffcc99;
  border-radius: 12px 12px 0 0;
  box-shadow: 0 -3px 12px rgba(0,0,0,0.35), inset 0 2px 4px rgba(255,255,255,0.4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 8px 2px 8px;
}
#mini-keyboard {
  width: 108px;
  height: 38px;
  background: #252d3d;
  border: 2px solid #3c4961;
  border-radius: 6px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.15);
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  padding: 2px 3px;
}
.kb-row {
  display: flex;
  justify-content: space-between;
  gap: 2px;
}
.kb-key {
  flex: 1;
  height: 8px;
  background: #e6ebf5;
  border-radius: 2px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  transition: all 0.08s ease;
}
.kb-key.active {
  background: #ff548d !important;
  box-shadow: 0 0 8px #ff548d, 0 1px 1px rgba(0,0,0,0.2) !important;
  transform: translateY(1px) scale(0.95);
}
#mouse-pad {
  width: 52px;
  height: 38px;
  background: #1c2738;
  border: 1.5px solid #2f3e58;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
}
#mini-mouse {
  width: 14px;
  height: 22px;
  background: #f0f7ff;
  border: 1.5px solid #00d2ff;
  border-radius: 7px 7px 5px 5px;
  box-shadow: 0 0 6px rgba(0, 210, 255, 0.6), 0 2px 4px rgba(0,0,0,0.3);
  position: relative;
  transition: transform 0.06s linear;
}
#mini-mouse::before {
  content: '';
  position: absolute;
  top: 3px;
  left: 5px;
  width: 2px;
  height: 5px;
  background: #00d2ff;
  border-radius: 1px;
}

/* Loading */
#loader-ui {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: opacity 0.5s ease;
}
.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid rgba(255, 105, 180, 0.2);
  border-top-color: #ff6599;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
#loader-text {
  margin-top: 8px;
  font-size: 10px;
  color: #ff6599;
  font-weight: 500;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
</style>

</head>

<!-- Dynamic Active Status Pill -->

<script>
console.log('[Live2D] Initializing Mini Compact Hiyori Pet...');

// ============================================================
// 1. ALL CONSTANTS & DATABASES (TOP DECLARED - ZERO TDZ)
// ============================================================
const ALL_MOTIONS = [
  { name: 'm01', file: 'motion/hiyori_m01.motion3.json', desc: '自然呼吸' },
  { name: 'm02', file: 'motion/hiyori_m02.motion3.json', desc: '好奇歪头' },
  { name: 'm03', file: 'motion/hiyori_m03.motion3.json', desc: '欢快点头' },
  { name: 'm04', file: 'motion/hiyori_m04.motion3.json', desc: '温婉侧身' },
  { name: 'm05', file: 'motion/hiyori_m05.motion3.json', desc: '困倦伸展' },
  { name: 'm06', file: 'motion/hiyori_m06.motion3.json', desc: '元气挥手' },
  { name: 'm07', file: 'motion/hiyori_m07.motion3.json', desc: '害羞微笑' },
  { name: 'm08', file: 'motion/hiyori_m08.motion3.json', desc: '开朗晃脑' },
  { name: 'm09', file: 'motion/hiyori_m09.motion3.json', desc: '惊喜轻跳' },

// 3. ALL CORE HELPER FUNCTIONS
// ============================================================
function setCoreParam(core, id, value) {
  try {
    const idx = core.getParameterIndex ? core.getParameterIndex(id) : -1;
    if (idx >= 0 && core.setParameterValueByIndex) {
      core.setParameterValueByIndex(idx, value);
    } else if (core.setParamFloat) {
      core.setParamFloat(id, value);
    }
  } catch(e) {}
}

function getCoreParam(core, id) {
  try {
    const idx = core.getParameterIndex ? core.getParameterIndex(id) : -1;
    if (idx >= 0 && core.getParameterValueByIndex) {
      return core.getParameterValueByIndex(idx);
    } else if (core.getParamFloat) {
      return core.getParamFloat(id);
    }
  } catch(e) {}
  return 0;
}

function blendCoreParam(core, id, targetVal, weight) {
  if (weight <= 0) return;
  if (weight >= 1) {
    setCoreParam(core, id, targetVal);
    return;
  }
  const current = getCoreParam(core, id);
  setCoreParam(core, id, current * (1.0 - weight) + targetVal * weight);
}

function setCorePartOpacity(core, id, opacity) {
  try {
    const idx = core.getPartIndex ? core.getPartIndex(id) : -1;
    if (idx >= 0 && core.setPartOpacityByIndex) {
      core.setPartOpacityByIndex(idx, opacity);
    }
  } catch(e) {}
}

let currentEdgeDock = null; // null | 'left' | 'right'

function onEdgeDockStateChanged(dockSide) {
  currentEdgeDock = dockSide;
  const deskStage = document.getElementById('desk-stage');
  const statusBadge = document.getElementById('status-badge');
  const timerPill = document.getElementById('focus-timer-pill');
  const careBubble = document.getElementById('care-bubble');
  const peekerR = document.getElementById('peeker-img-right');
  const peekerL = document.getElementById('peeker-img-left');

  if (dockSide === 'right') {
    if (model) model.visible = false;
    if (deskStage) deskStage.classList.add('desk-hidden');
    if (statusBadge) statusBadge.classList.remove('badge-visible');
    if (timerPill) timerPill.classList.add('timer-pill-hidden');
    if (careBubble) careBubble.classList.add('care-bubble-hidden');

    if (peekerR) peekerR.style.display = 'block';
    if (peekerL) peekerL.style.display = 'none';
  } else if (dockSide === 'left') {
    if (model) model.visible = false;
    if (deskStage) deskStage.classList.add('desk-hidden');
    if (statusBadge) statusBadge.classList.remove('badge-visible');
    if (timerPill) timerPill.classList.add('timer-pill-hidden');
    if (careBubble) careBubble.classList.add('care-bubble-hidden');

    if (peekerL) peekerL.style.display = 'block';
    if (peekerR) peekerR.style.display = 'none';
  } else {
    if (model) model.visible = true;
    if (deskStage) deskStage.classList.remove('desk-hidden');
    if (peekerR) peekerR.style.display = 'none';
    if (peekerL) peekerL.style.display = 'none';
  }
}
window.onEdgeDockStateChanged = onEdgeDockStateChanged;


function layoutModel() {
  if (!model) return;
  const w = window.innerWidth || 205;
  const h = window.innerHeight || 305;

  const targetScale = 0.145;
  model.scale.set(targetScale, targetScale);
  model.anchor.set(0.5, 0.0);
  model.position.set(w * 0.5, 72);
}

function playNamedProceduralAction(actionName) {
  const action = PROCEDURAL_ACTIONS.find(a => a.name === actionName);
  if (action) {
    activeProceduralAction = action;
    proceduralStartTime = Date.now();
    proceduralDuration = action.duration;
  }
}

function playRandomAction() {
  if (!model || petState === 'sleep' || trackWeight > 0.3 || activeProceduralAction) return;

  const rand = Math.random();
  if (rand < 0.5 && model.motion) {
    const chosen = ALL_MOTIONS[Math.floor(Math.random() * ALL_MOTIONS.length)];
    try {
      model.motion(chosen.name);
    } catch(e) {}
  } else {
    const chosenProc = PROCEDURAL_ACTIONS[Math.floor(Math.random() * PROCEDURAL_ACTIONS.length)];
    playNamedProceduralAction(chosenProc.name);
  }
}

function getCurrentTimeSlot() {
  const h = new Date().getHours();
  if (h >= 0 && h < 7) return 'late_night';
  if (h >= 7 && h < 11 || (h === 11 && new Date().getMinutes() < 30)) return 'morning';
  if (h >= 11 && h < 18) return 'afternoon';
  return 'evening';
}

function playAlarmChime() {
  if (!window._soundEnabled) {
    console.log('[Audio] Sound muted, skipping chime.');
    return;
  }
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    if (ctx.state === 'suspended') {
      ctx.resume();
    }
    // 悦耳的高音四音符琶音: C6 -> E6 -> G6 -> C7 (1046Hz, 1318Hz, 1568Hz, 2093Hz)
    const notes = [1046.5, 1318.5, 1567.98, 2093.0];
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.13);

      gain.gain.setValueAtTime(0.0001, ctx.currentTime + idx * 0.13);
      gain.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + idx * 0.13 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.13 + 0.75);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.13);
      osc.stop(ctx.currentTime + idx * 0.13 + 0.8);
    });
  } catch(e) {
    console.log('[Audio] Chime play error:', e);
  }
}
window.playAlarmChime = playAlarmChime;

function onGlobalMouseMove(normX, normY, distPx = 9999) {
  const now = Date.now();
  lastInputTime = now;

  targetMouseX = Math.max(-1, Math.min(1, parseFloat(normX) || 0));
  targetMouseY = Math.max(-1, Math.min(1, parseFloat(normY) || 0));

  const d = parseFloat(distPx) || 9999;
  const moved = Math.hypot(targetMouseX - prevMouseX, targetMouseY - prevMouseY);

  if (moved > 0.001) {
    prevMouseX = targetMouseX;
    prevMouseY = targetMouseY;

    // 状态切换：从外部靠近触发
    if (gazeState === 'READY_TO_APPROACH') {
      if (d <= PROXIMITY_ENTER_DIST) {
        gazeState = 'GAZING_ACTIVE';
        gazeStartTime = now;
        gazeLastMoveTime = now;
        interruptAllIdleMotions(); // 暴力打断一切待机与动作

        if (petState === 'sleep') {
          petState = 'idle';
          const sfx = document.getElementById('sleep-fx');
          if (sfx) sfx.style.display = 'none';
        }
      }
    } else if (gazeState === 'GAZING_ACTIVE') {
      gazeLastMoveTime = now;
    }
  }

  // 移出感应范围 (或等待3.5秒后) 自动重置为 READY_TO_APPROACH，下次靠近立刻再次触发
  if (gazeState === 'WAITING_FOR_LEAVE') {
    if (d > PROXIMITY_LEAVE_DIST || (now - gazeStartTime > 4500)) {
      gazeState = 'READY_TO_APPROACH';
    }
  }

  const miniMouse = document.getElementById('mini-mouse');
  const padX = (targetMouseX * 9);
  const padY = (targetMouseY * 6);
  if (miniMouse) {
    miniMouse.style.transform = `translate(${padX}px, ${padY}px)`;
  }
}
window.onGlobalMouseMove = onGlobalMouseMove;

function applyLive2DOverrides(core) {
  if (!core) return;
  const now = Date.now();
  const timeSinceKey = now - lastKeyPressTime;
  const isTyping = timeSinceKey < 1200;
  const isGazing = (gazeState === 'GAZING_ACTIVE');

  setCorePartOpacity(core, 'PartArmA', 1.0);
  setCorePartOpacity(core, 'PartArmB', 0.0);

  if (petState === 'sleep') {
    const sleepBreath = Math.sin(timeElapsed * 1.4) * 0.1;
    setCoreParam(core, 'ParamAngleX', Math.sin(timeElapsed * 0.4) * 4);
    setCoreParam(core, 'ParamAngleY', -24 + sleepBreath * 8);
    setCoreParam(core, 'ParamAngleZ', 8);
    setCoreParam(core, 'ParamEyeBallX', 0);
    setCoreParam(core, 'ParamEyeBallY', -0.6);
    setCoreParam(core, 'ParamBodyAngleX', 2);
    setCoreParam(core, 'ParamBodyAngleY', -8);
    setCoreParam(core, 'ParamEyeLOpen', 0);
    setCoreParam(core, 'ParamEyeROpen', 0);
    setCoreParam(core, 'ParamMouthOpenY', 0);
    setCoreParam(core, 'ParamCheek', 0.15);
    setCoreParam(core, 'ParamBreath', 0.5 + sleepBreath);
    setCoreParam(core, 'ParamShoulder', -0.3);
  } else if (isGazing || isTyping || trackWeight > 0.01) {
    // 🌟 注视主人 / 伴工打字 拥有 100% 最高统治优先级 (彻底打断任何待机动作)
    activeProceduralAction = null;

    blendCoreParam(core, 'ParamAngleX', currentMouseX * 30, trackWeight);
    blendCoreParam(core, 'ParamAngleY', currentMouseY * 24 - 3, trackWeight);
    blendCoreParam(core, 'ParamAngleZ', currentMouseX * 10, trackWeight);
    blendCoreParam(core, 'ParamEyeBallX', currentMouseX * 1.0, trackWeight);
    blendCoreParam(core, 'ParamEyeBallY', currentMouseY * 1.0, trackWeight);
    blendCoreParam(core, 'ParamBrowLY', currentMouseY * 0.35, trackWeight);
    blendCoreParam(core, 'ParamBrowRY', currentMouseY * 0.35, trackWeight);
    blendCoreParam(core, 'ParamBodyAngleX', currentMouseX * 8, trackWeight);

    if (isTyping) {
      setCoreParam(core, 'ParamCheek', 0.55);
      setCoreParam(core, 'ParamMouthOpenY', 0.12);
      setCoreParam(core, 'ParamEyeLSmile', 0.65);
      setCoreParam(core, 'ParamEyeRSmile', 0.65);
    }
  } else {
    // 待机发呆动作 (仅在没有注视、没有打字时执行)
    if (activeProceduralAction) {
      const elapsedAction = now - proceduralStartTime;
      const progress = Math.min(1.0, elapsedAction / proceduralDuration);
      if (progress >= 1.0) {
        activeProceduralAction = null;
      } else {
        activeProceduralAction.animate(progress, core);
      }
    }
  }
}

function updateLive2DParams(delta) {
  try {
    const now = Date.now();
    const timeSinceKey = now - lastKeyPressTime;
    const idleSec = (now - lastInputTime) / 1000;
    const dt = (delta || 1) * 0.016;
    timeElapsed += dt;

    const isTyping = timeSinceKey < 1200;

    // 检查注视状态：停下满2秒或单次注视满8秒则回归待机发呆
    if (gazeState === 'GAZING_ACTIVE') {
      const timeSinceMove = now - gazeLastMoveTime;
      const sessionDuration = now - gazeStartTime;
      if (timeSinceMove >= 2000 || sessionDuration > 8000) {
        gazeState = 'WAITING_FOR_LEAVE'; // 回归待机发呆，圈内再动不打扰
      } else {
        if (activeProceduralAction) {
          activeProceduralAction = null; // 靠近注视拥有最高优先级，立即打断待机动作
        }
      }
    }

    const isGazing = (gazeState === 'GAZING_ACTIVE');

    updateStatusBadge(isTyping, isGazing);

    // 待机随机动作调度 (发呆时每8~17秒自然触发)
    if (!isGazing && !isTyping && petState !== 'sleep' && !activeProceduralAction && trackWeight <= 0.05) {
      if (now - lastActionTime > nextActionInterval) {
        lastActionTime = now;
        nextActionInterval = (8 + Math.random() * 9) * 1000;
        playRandomAction();
      }
    }

    // 权重平滑插值 (0.0 = 纯发呆动作, 1.0 = 纯注视主人)
    const targetWeight = (isGazing || isTyping) ? 1.0 : 0.0;
    const blendSpeed = isGazing ? 0.45 : 0.12;
    trackWeight += (targetWeight - trackWeight) * blendSpeed;
    if (trackWeight < 0.005) trackWeight = 0.0;
    if (trackWeight > 0.995) trackWeight = 1.0;

    // 鼠标坐标灵敏插值 (Snappy, responsive eye tracking)
    const lerpSpeed = 0.48;
    currentMouseX += (targetMouseX - currentMouseX) * lerpSpeed;
    currentMouseY += (targetMouseY - currentMouseY) * lerpSpeed;

    // 挂机酣睡 (>35s)
    if (idleSec > 35 && !activeProceduralAction) {
      if (petState !== 'sleep') {
        petState = 'sleep';
        const sfx = document.getElementById('sleep-fx');
        if (sfx) sfx.style.display = 'block';
      }
    } else if (!isTyping && petState === 'sleep') {
      petState = 'idle';
      const sfx = document.getElementById('sleep-fx');
      if (sfx) sfx.style.display = 'none';
    }
  } catch(err) {
    console.error('[Live2D Render Loop Error]:', err);
  }
}

    if (model.internalModel && model.internalModel.motionManager) {
      const origMotionUpdate = model.internalModel.motionManager.update.bind(model.internalModel.motionManager);
      model.internalModel.motionManager.update = function(coreModel, now) {
        const updated = origMotionUpdate(coreModel, now);
        applyLive2DOverrides(coreModel);
        return updated;
      };
    }

    app.ticker.add((delta) => {
      updateLive2DParams(delta);
    });

  } catch(err) {
    console.error('[Live2D] Failed to load Hiyori model:', err);
    const loaderText = document.getElementById('loader-text');
    if (loaderText) loaderText.textContent = '❌ 加载失败: ' + err.message;
  }
}

window.onGlobalKeyPress = function(keyName) {
  lastInputTime = Date.now();
  lastKeyPressTime = Date.now();

  if (keyElements.length > 0) {
    const rIdx = Math.floor(Math.random() * keyElements.length);
    const k = keyElements[rIdx];
    k.classList.add('active');
    setTimeout(() => k.classList.remove('active'), 140);
  }
};

window.addEventListener('resize', layoutModel);

window.addEventListener('DOMContentLoaded', () => {
  keyElements = Array.from(document.querySelectorAll('.kb-key'));
  loadHiyoriModel();
});

// ============================================================
// 5. 窗口拖拽与右键菜单桥接 (Capture Phase Interception)
// ============================================================
let isDraggingWindow = false;

window.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  e.stopPropagation();
  e.stopImmediatePropagation();
  if (window._pb && window._pb.onRightClick) {
    window._pb.onRightClick(e.screenX, e.screenY);
  }
  return false;
}, true);

window.addEventListener('mousedown', (e) => {
  if (e.target.closest('#snack-tray') || e.target.closest('#timer-modal') || e.target.closest('#care-bubble') || e.target.closest('#headpat-zone')) {
    return;
  }
  if (e.button === 0) {
    isDraggingWindow = true;
    if (window._pb && window._pb.onDragStart) {
      window._pb.onDragStart(e.screenX, e.screenY);
    }
  } else if (e.button === 2) {
    e.preventDefault();
    e.stopPropagation();
    if (window._pb && window._pb.onRightClick) {
      window._pb.onRightClick(e.screenX, e.screenY);
    }
  }
}, true);

window.addEventListener('mousemove', (e) => {
  if (isDraggingWindow && window._pb && window._pb.onDragMove) {
    window._pb.onDragMove(e.screenX, e.screenY);
  }
}, true);

window.addEventListener('mouseup', (e) => {
  if (isDraggingWindow) {
    isDraggingWindow = false;
    if (window._pb && window._pb.onDragEnd) {
      window._pb.onDragEnd();
    }
  }
}, true);

window.addEventListener('dblclick', (e) => {
  if (e.target.closest('#snack-tray') || e.target.closest('#timer-modal') || e.target.closest('#headpat-zone')) {
    return;
  }
  if (window._pb && window._pb.onUserDoubleClick) {
    window._pb.onUserDoubleClick();
  }
}, true);

// Setup QWebChannel Transport
if (typeof QWebChannel !== 'undefined') {
  new QWebChannel(qt.webChannelTransport, function(channel) {
    window._pb = channel.objects.petBridge || channel.objects.pet;
    console.log('[Live2D] window._pb is connected:', !!window._pb);
  });
}

// 🌗 主题同步机制（跟随主聊天窗口深浅色，简约纯净无花哨）
function setPetTheme(theme) {
  const isLight = (theme === 'light');
  if (isLight) {
    document.body.classList.remove('theme-dark');
    document.body.classList.add('theme-light');
  } else {
    document.body.classList.remove('theme-light');
    document.body.classList.add('theme-dark');
  }
}
window.setPetTheme = setPetTheme;

// 初始化检测 URL 参数中携带的主题
(function initThemeFromUrl() {
  try {
    const params = new URLSearchParams(window.location.search);
    const theme = params.get('theme') || 'dark';
    setPetTheme(theme);
  } catch(e) {
    setPetTheme('dark');
  }
})();
</script>
